name: Build Dream APK

# Satu file ini berisi seluruh proyek Dream. Saat dijalankan, ia menulis
# semua file proyek lalu membangun APK-nya. Tidak perlu file lain di repo.

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Tulis file konfigurasi dan resource
        run: |
          set -e
          cat > settings.gradle.kts <<'DREAM_EOF_1'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Dream"
          include(":app")
          DREAM_EOF_1
          cat > build.gradle.kts <<'DREAM_EOF_1'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.20" apply false
          }
          DREAM_EOF_1
          cat > gradle.properties <<'DREAM_EOF_1'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          DREAM_EOF_1
          cat > .gitignore <<'DREAM_EOF_1'
          build/
          .gradle/
          .idea/
          local.properties
          *.iml
          .DS_Store
          DREAM_EOF_1
          mkdir -p app
          cat > app/build.gradle.kts <<'DREAM_EOF_1'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.dream.boost"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.dream.boost"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      // ditandatangani dengan debug key supaya APK langsung bisa di-install
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }

              lint {
                  abortOnError = false
                  checkReleaseBuilds = false
              }
              packaging {
                  resources { excludes += "/META-INF/{AL2.0,LGPL2.1}" }
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.animation:animation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
              implementation("dev.rikka.shizuku:api:13.1.5")
              implementation("dev.rikka.shizuku:provider:13.1.5")
          }
          DREAM_EOF_1
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'DREAM_EOF_1'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="moe.shizuku.manager.permission.API_V23" />

              <queries>
                  <package android:name="moe.shizuku.privileged.api" />
              </queries>

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.Dream">

                  <provider
                      android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="${applicationId}.shizuku"
                      android:enabled="true"
                      android:exported="true"
                      android:multiprocess="false"
                      android:permission="android.permission.INTERACT_ACROSS_USERS_FULL" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          DREAM_EOF_1
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'DREAM_EOF_1'
          <resources>
              <string name="app_name">Dream</string>
          </resources>
          DREAM_EOF_1
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/themes.xml <<'DREAM_EOF_1'
          <resources>
              <style name="Theme.Dream" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
              </style>
          </resources>
          DREAM_EOF_1
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'DREAM_EOF_1'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          DREAM_EOF_1
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'DREAM_EOF_1'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          DREAM_EOF_1
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher_background.xml <<'DREAM_EOF_1'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:pathData="M0,0h108v108h-108z">
                  <aapt:attr name="android:fillColor">
                      <gradient
                          android:type="radial"
                          android:centerX="54"
                          android:centerY="54"
                          android:gradientRadius="76">
                          <item android:offset="0.0" android:color="#FF3A0A6E" />
                          <item android:offset="0.55" android:color="#FF14002B" />
                          <item android:offset="1.0" android:color="#FF000000" />
                      </gradient>
                  </aapt:attr>
              </path>
              <path android:fillColor="#AAFFFFFF" android:pathData="M13.1,20a0.9,0.9 0 1,0 1.8,0a0.9,0.9 0 1,0 -1.8,0z" />
              <path android:fillColor="#88E9D5FF" android:pathData="M90.2,14a0.8,0.8 0 1,0 1.6,0a0.8,0.8 0 1,0 -1.6,0z" />
              <path android:fillColor="#99FFFFFF" android:pathData="M95.1,78a1,1 0 1,0 2,0a1,1 0 1,0 -2,0z" />
              <path android:fillColor="#88E9D5FF" android:pathData="M10.2,88a0.8,0.8 0 1,0 1.6,0a0.8,0.8 0 1,0 -1.6,0z" />
              <path android:fillColor="#77FFFFFF" android:pathData="M30.3,8a0.7,0.7 0 1,0 1.4,0a0.7,0.7 0 1,0 -1.4,0z" />
              <path android:fillColor="#77FFFFFF" android:pathData="M78.3,96a0.7,0.7 0 1,0 1.4,0a0.7,0.7 0 1,0 -1.4,0z" />
          </vector>
          DREAM_EOF_1
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher_foreground.xml <<'DREAM_EOF_1'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path android:pathData="M54,54m-31,0a31,31 0 1,0 62,0a31,31 0 1,0 -62,0z">
                  <aapt:attr name="android:fillColor">
                      <gradient
                          android:type="radial"
                          android:centerX="54"
                          android:centerY="54"
                          android:gradientRadius="31">
                          <item android:offset="0.0" android:color="#00A855F7" />
                          <item android:offset="0.5" android:color="#00A855F7" />
                          <item android:offset="0.68" android:color="#66A855F7" />
                          <item android:offset="1.0" android:color="#00A855F7" />
                      </gradient>
                  </aapt:attr>
              </path>

              <group android:pivotX="54" android:pivotY="54" android:rotation="-18">
                  <path
                      android:fillType="evenOdd"
                      android:pathData="M21,54a33,10 0 1,0 66,0a33,10 0 1,0 -66,0zM30,54a24,6 0 1,0 48,0a24,6 0 1,0 -48,0z">
                      <aapt:attr name="android:fillColor">
                          <gradient
                              android:type="linear"
                              android:startX="21"
                              android:startY="54"
                              android:endX="87"
                              android:endY="54">
                              <item android:offset="0.0" android:color="#FF5B21B6" />
                              <item android:offset="0.5" android:color="#FFF5D0FE" />
                              <item android:offset="1.0" android:color="#FFC026D3" />
                          </gradient>
                      </aapt:attr>
                  </path>
              </group>

              <path
                  android:pathData="M34,52a20,20 0 0,1 40,0"
                  android:strokeWidth="2.6"
                  android:strokeLineCap="round"
                  android:fillColor="#00000000">
                  <aapt:attr name="android:strokeColor">
                      <gradient
                          android:type="linear"
                          android:startX="34"
                          android:startY="52"
                          android:endX="74"
                          android:endY="52">
                          <item android:offset="0.0" android:color="#00B24BFF" />
                          <item android:offset="0.5" android:color="#FFF5D0FE" />
                          <item android:offset="1.0" android:color="#00B24BFF" />
                      </gradient>
                  </aapt:attr>
              </path>

              <path
                  android:fillColor="#FF000000"
                  android:strokeColor="#FFC084FC"
                  android:strokeWidth="1.1"
                  android:pathData="M36,54a18,18 0 1,0 36,0a18,18 0 1,0 -36,0z" />

              <group android:pivotX="54" android:pivotY="54" android:rotation="-18">
                  <path android:pathData="M21,54a33,10 0 0,0 66,0L78,54a24,6 0 0,1 -48,0z">
                      <aapt:attr name="android:fillColor">
                          <gradient
                              android:type="linear"
                              android:startX="21"
                              android:startY="54"
                              android:endX="87"
                              android:endY="54">
                              <item android:offset="0.0" android:color="#FF5B21B6" />
                              <item android:offset="0.5" android:color="#FFF5D0FE" />
                              <item android:offset="1.0" android:color="#FFC026D3" />
